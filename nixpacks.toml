[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_EXTENSIONS = "pdo_mysql,pdo_sqlite,mbstring,tokenizer,xml,ctype,fileinfo,openssl,bcmath"

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[start]
cmd = "sh startup.sh"
